name: Claude PR review

# Reviews when a PR is opened, reopened or marked ready. To ask for a re-review after new
# pushes, add the label "claude-review". Not on every push, to keep usage down.
# Bot PRs (Dependabot) are skipped: they get no access to the Claude token secret.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    # Job-level, so a skipped run (e.g. another label added) can't cancel a review in progress.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Uses the owner's Claude subscription (token from `claude setup-token`), not a paid API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request to the clariva-hq organisation's `.github` repo: the org's
            engineering standards (STANDARDS.md), security policy and default templates. No code.

            Review only the changes in this PR (use `gh pr diff`). Focus on, in order:
            1. Rules that are unclear, contradict each other, or contradict what the repos actually do.
            2. Anything that should not be public: secrets, internal hostnames or IPs, personal data.
            3. Broken links and wrong file paths.
            Skip wording nits.

            Post inline comments on specific lines for concrete problems, with a suggested fix.
            Then post one summary comment with `gh pr comment`: a verdict (looks good / changes
            suggested), and the findings ranked most severe first. Be concise. If you find
            nothing significant, say so in one line.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
